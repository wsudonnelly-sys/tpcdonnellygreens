function pickHoleOnFly(holeId) {
  state.currentRound.currentPick = ALL_HOLES[holeId];
  state.currentRound.currentScores = state.currentRound.players.map(function() { return null; });
  renderPlayPage();
}

function setPickScore(pi, val) {
  var r = state.currentRound;
  r.currentScores[pi] = r.currentScores[pi] === val ? null : val;
  renderPlayPage();
}

function recordPickHole() {
  var r = state.currentRound;
  r.holes.push(r.currentPick);
  for (var pi = 0; pi < r.players.length; pi++) r.scores[pi].push(r.currentScores[pi]);
  r.currentPick = null;
  r.currentScores = null;
  renderPlayPage();
}

function finishPickAsYouGo() {
  // Save as a round (create a temp course)
  var r = state.currentRound;
  if (r.holes.length > 0) {
    var holeIds = r.holes.map(function(h) { return h.id; });
    var totalPar = 0, totalDiff = 0;
    for (var i = 0; i < holeIds.length; i++) { totalPar += ALL_HOLES[holeIds[i]].par; totalDiff += ALL_HOLES[holeIds[i]].difficulty; }
    var saveCourse = false;
    var courseName = 'Course (' + r.holes.length + ' holes)';
    try { saveCourse = window.confirm('Save this layout as a reusable course?'); } catch(e) {}
    if (saveCourse) {
      try { var input = window.prompt('Course name:'); if (input) courseName = input; } catch(e) {}
    }
    var course = { id: Date.now(), name: courseName, holeIds: holeIds, totalPar: totalPar, avgDifficulty: totalDiff / holeIds.length };
    if (saveCourse) state.courses.push(course);
    
    var results = [];
    for (var pi = 0; pi < r.players.length; pi++) {
      var total = 0;
      for (var s = 0; s < r.scores[pi].length; s++) total += (r.scores[pi][s] || 0);
      results.push({ playerId: r.players[pi].id, playerName: r.players[pi].name, scores: r.scores[pi].slice(), total: total });
    }
    state.rounds.push({ id: Date.now(), courseId: course.id, courseName: course.name, coursePar: totalPar, courseDifficulty: course.avgDifficulty, date: new Date().toISOString(), results: results });
    recalcHandicaps();
    saveState();
  }
  state.currentRound = null;
  document.getElementById('main-nav').style.display = '';
  document.querySelector('.app-header').style.display = '';
  document.querySelector('.container').style.padding = '';
  document.querySelector('.container').style.maxWidth = '';
  showPage('history');
}

function finishRound() {
  var r = state.currentRound;
  var course = null;
  if (r.courseId === -1) {
    // Temp course from random selection - save it automatically
    var holeIds = r.holes.map(function(h) { return h.id; });
    var totalPar = 0, totalDiff = 0;
    for (var i = 0; i < holeIds.length; i++) { totalPar += ALL_HOLES[holeIds[i]].par; totalDiff += ALL_HOLES[holeIds[i]].difficulty; }
    course = { id: Date.now(), name: r.courseName, holeIds: holeIds, totalPar: totalPar, avgDifficulty: totalDiff / holeIds.length };
    state.courses.push(course);
    r.courseId = course.id;
  } else {
    for (var i = 0; i < state.courses.length; i++) { if (state.courses[i].id === r.courseId) { course = state.courses[i]; break; } }
  }
  if (!course) return;
  var results = [];
  for (var pi = 0; pi < r.players.length; pi++) {
    var total = 0;
    for (var s = 0; s < r.scores[pi].length; s++) total += (r.scores[pi][s] || 0);
    results.push({ playerId: r.players[pi].id, playerName: r.players[pi].name, scores: r.scores[pi].slice(), total: total });
  }
  state.rounds.push({ id: Date.now(), courseId: r.courseId, courseName: r.courseName, coursePar: course.totalPar, courseDifficulty: course.avgDifficulty, date: new Date().toISOString(), results: results });
  recalcHandicaps();
  state.currentRound = null;
  saveState();
  document.getElementById('main-nav').style.display = '';
  document.querySelector('.app-header').style.display = '';
  document.querySelector('.container').style.padding = '';
  document.querySelector('.container').style.maxWidth = '';
  showPage('history');
}

// ===================== HANDICAP =====================
function recalcHandicaps() {
  for (var pi = 0; pi < state.players.length; pi++) {
    var player = state.players[pi];
    var diffs = [];
    for (var ri = state.rounds.length - 1; ri >= Math.max(0, state.rounds.length - 10); ri--) {
      var round = state.rounds[ri];
      for (var rr = 0; rr < round.results.length; rr++) {
        if (round.results[rr].playerId === player.id) {
          var course = null;
          for (var ci = 0; ci < state.courses.length; ci++) { if (state.courses[ci].id === round.courseId) { course = state.courses[ci]; break; } }
          var factor = course ? (course.avgDifficulty <= 2 ? 0.8 : course.avgDifficulty <= 3.5 ? 1.0 : 1.2) : 1.0;
          diffs.push((round.results[rr].total - round.coursePar) * factor);
          break;
        }
      }
    }
    if (diffs.length >= 3) {
      diffs.sort(function(a, b) { return a - b; });
      player.handicap = Math.round(((diffs[0] + diffs[1] + diffs[2]) / 3) * 10) / 10;
    } else { player.handicap = null; }
  }
}

// ===================== PLAYERS =====================
function renderPlayersPage() {
  var html = '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg> Golfers</div>';
  html += '<div class="card-subtitle">Tap a golfer for full stats and badges.<br><span style="color:var(--warning);font-size:11px">&#9888; Prototype: Data resets if the page reloads. In the real app, all data persists via SQLite.</span></div>';
  html += '<div class="flex gap-8 mb-16"><input class="input" id="new-player" placeholder="Add a golfer..." style="flex:1;font-size:16px" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off">';
  html += '<button class="btn btn-primary" onclick="addPlayer()">+ Add</button></div>';
  html += '<div class="mb-12"><input class="input" id="player-search" placeholder="&#128269; Search golfers..." oninput="filterPlayers(this.value)" style="font-size:16px" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off"></div>';

  // Sort players by most recent round (active players first)
  var sortedPlayers = state.players.slice().sort(function(a, b) {
    var aLast = 0, bLast = 0;
    for (var ri = 0; ri < state.rounds.length; ri++) {
      for (var rr = 0; rr < state.rounds[ri].results.length; rr++) {
        if (state.rounds[ri].results[rr].playerId === a.id) aLast = Math.max(aLast, state.rounds[ri].id);
        if (state.rounds[ri].results[rr].playerId === b.id) bLast = Math.max(bLast, state.rounds[ri].id);
      }
    }
    return bLast - aLast;
  });

  // Limit to 8 unless searching
  var searchVal = (document.getElementById('player-search') && document.getElementById('player-search').value) || '';
  var showAll = state._showAllGolfers || searchVal.length > 0;
  var displayPlayers = showAll ? sortedPlayers : sortedPlayers.slice(0, 8);
  var hiddenCount = sortedPlayers.length - 8;

  for (var i = 0; i < displayPlayers.length; i++) {
    var p = displayPlayers[i];
    var stats = getPlayerStats(p.id);
    var rc = stats.roundsPlayed;
    // Count badges
    var badgeCount = 0;
    for (var ai = 0; ai < ACHIEVEMENTS.length; ai++) { if (ACHIEVEMENTS[ai].check(stats)) badgeCount++; }
    // Win count
    var wins = 0;
    for (var ri = 0; ri < state.rounds.length; ri++) {
      var round = state.rounds[ri];
      var myResult = null; var isBest = true;
      for (var rr = 0; rr < round.results.length; rr++) {
        if (round.results[rr].playerId === p.id) myResult = round.results[rr];
      }
      if (myResult) {
        for (var rr = 0; rr < round.results.length; rr++) {
          if (round.results[rr].playerId !== p.id && round.results[rr].total < myResult.total) { isBest = false; break; }
        }
        if (isBest) wins++;
      }
    }
    var winPct = rc > 0 ? Math.round((wins / rc) * 100) : 0;

    html += '<div class="player-row" style="cursor:pointer;flex-wrap:wrap" onclick="showPlayerDetail(' + p.id + ')">';
    html += '<div class="player-avatar">' + p.name[0].toUpperCase() + '</div>';
    html += '<div style="flex:1;min-width:120px"><div style="font-weight:600;font-size:15px">' + p.name + (p.lastName ? ' ' + p.lastName : '') + '</div>';
    html += '<div style="font-size:11px;color:var(--text-muted)">' + rc + ' rounds &middot; ' + wins + ' wins (' + winPct + '%) &middot; ' + badgeCount + ' badges</div></div>';
    html += '<div style="text-align:right"><div style="font-family:var(--font-mono);font-weight:700;color:var(--primary);font-size:14px">' + (p.handicap !== null ? 'HC ' + p.handicap : '--') + '</div>';
    html += '<div style="font-size:10px;color:var(--text-muted)">Handicap</div></div>';
    html += '</div>';
  }
  if (!showAll && hiddenCount > 0) {
    html += '<div style="text-align:center;padding:12px"><button class="btn btn-sm btn-secondary" onclick="state._showAllGolfers=true;renderPlayersPage()">Show all ' + sortedPlayers.length + ' golfers</button></div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg> Handicap System</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.8">';
  html += '<p><strong style="color:var(--text)">Differential</strong> = (Score &minus; Par) &times; Course Factor</p>';
  html += '<p><strong style="color:var(--text)">Course Factor:</strong> Easy = 0.85 &middot; Medium = 1.0 &middot; Hard = 1.15</p>';
  html += '<p><strong style="color:var(--text)">Handicap</strong> = Avg of best 8 differentials from last 20 rounds</p>';
  html += '<p><strong style="color:var(--text)">Net Score</strong> = Gross &minus; Handicap (toggle on/off per round)</p>';
  html += '<p style="color:var(--text-muted);margin-top:8px;font-size:12px">Minimum 3 rounds required to establish handicap.</p></div></div>';
  // Data Management section
  html += '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Data Management</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">Export your data to back it up or share with the developer. Import to restore from a backup.</div>';
  html += '<div class="flex gap-8" style="flex-wrap:wrap">';
  html += '<button class="btn btn-primary" onclick="exportData()" style="flex:1;min-width:120px">&#128229; Export Data</button>';
  html += '<button class="btn" onclick="importDataPrompt()" style="flex:1;min-width:120px;border-color:var(--primary);color:var(--primary)">&#128228; Import Data</button>';
  html += '</div>';
  html += '<textarea id="data-io-area" style="display:none;width:100%;height:200px;margin-top:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--font-mono);font-size:11px;resize:vertical" placeholder="Paste exported data here..."></textarea>';
  html += '</div>';
  document.getElementById('page-players').innerHTML = html;
}

function addPlayer() { var input = document.getElementById('new-player'); if (!input || !input.value.trim()) return; state.players.push({ id: Date.now(), name: input.value.trim(), handicap: null }); saveState(); renderPlayersPage(); }
function deletePlayer(id) { state.players = state.players.filter(function(p) { return p.id !== id; }); saveState(); renderPlayersPage(); }

function exportData() {
  var data = {
    version: 1,
    exportDate: new Date().toISOString(),
    players: state.players,
    courses: state.courses,
    rounds: state.rounds,
    courseSize: state.courseSize
  };
  var json = JSON.stringify(data, null, 2);
  var ta = document.getElementById('data-io-area');
  if (ta) {
    ta.style.display = 'block';
    ta.value = json;
    ta.select();
    try { document.execCommand('copy'); showToast('Data copied to clipboard!'); } catch(e) { showToast('Data exported below — copy it manually.'); }
  }
}

function importDataPrompt() {
  var ta = document.getElementById('data-io-area');
  if (ta) {
    ta.style.display = 'block';
    ta.value = '';
    ta.placeholder = 'Paste exported JSON data here, then click Import below...';
    ta.focus();
    // Add import button if not already there
    if (!document.getElementById('import-confirm-btn')) {
      var btn = document.createElement('button');
      btn.id = 'import-confirm-btn';
      btn.className = 'btn btn-primary';
      btn.style.cssText = 'margin-top:8px;width:100%';
      btn.textContent = '\u2705 Import & Replace Data';
      btn.onclick = function() { doImport(); };
      ta.parentNode.insertBefore(btn, ta.nextSibling);
    }
  }
}

function doImport() {
  var ta = document.getElementById('data-io-area');
  if (!ta || !ta.value.trim()) { showToast('Nothing to import.'); return; }
  try {
    var data = JSON.parse(ta.value.trim());
    if (!data.players || !data.courses) { showToast('Invalid data format.'); return; }
    if (!confirm('This will REPLACE all current players, courses, and rounds. Continue?')) return;
    state.players = data.players;
    state.courses = data.courses;
    state.rounds = data.rounds || [];
    if (data.courseSize) state.courseSize = data.courseSize;
    saveState();
    showToast('Data imported successfully!');
    ta.style.display = 'none';
    var btn = document.getElementById('import-confirm-btn');
    if (btn) btn.remove();
    renderPlayersPage();
  } catch(e) {
    showToast('Error: Invalid JSON. Check the pasted data.');
  }
}

function showToast(msg) {
  var existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface-2);color:var(--text);padding:12px 24px;border-radius:12px;font-size:13px;z-index:9999;border:1px solid var(--primary);box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:fadeInUp 0.3s';
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}


// ===================== HISTORY =====================
function renderHistoryPage() {
  var html = '';

  if (state.rounds.length === 0) {
    html += '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg> History</div>';
    html += '<div class="empty-state"><div class="emoji">&#9971;</div><p>No rounds completed yet. Hit the course!</p></div></div>';
    document.getElementById('page-history').innerHTML = html;
    return;
  }

  html += '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg> History</div>';

  // --- ALL-TIME BEST (GHIN-style Handicap Index) ---
  html += '<label class="label" style="margin-bottom:6px">&#127942; All-Time Best (Handicap Index)</label>';
  html += '<div style="font-size:10px;color:var(--text-muted);margin-bottom:10px">GHIN-style: best 8 of last 20 differentials, adjusted for course difficulty. Lower is better.</div>';

  // Calculate handicap index per player
  var golferDiffs = {};
  for (var ri = 0; ri < state.rounds.length; ri++) {
    var round = state.rounds[ri];
    // Difficulty factor like slope adjustment
    var diffFactor = 1.0;
    if (round.courseDifficulty) {
      if (round.courseDifficulty <= 2) diffFactor = 0.85;
      else if (round.courseDifficulty <= 3.5) diffFactor = 1.0;
      else diffFactor = 1.15;
    }
    for (var rr = 0; rr < round.results.length; rr++) {
      var res = round.results[rr];
      if (!golferDiffs[res.playerId]) golferDiffs[res.playerId] = { name: res.playerName, id: res.playerId, diffs: [] };
      var differential = (res.total - round.coursePar) * diffFactor;
      golferDiffs[res.playerId].diffs.push(differential);
    }
  }

  var golferRank = [];
  var gKeys = Object.keys(golferDiffs);
  for (var gi = 0; gi < gKeys.length; gi++) {
    var g = golferDiffs[gKeys[gi]];
    // Take last 20 differentials
    var recent = g.diffs.slice(-20);
    // Sort ascending, take best 8 (or fewer if < 8 rounds)
    var sorted = recent.slice().sort(function(a, b) { return a - b; });
    var bestN = Math.min(8, sorted.length);
    var bestDiffs = sorted.slice(0, bestN);
    var handicapIdx = bestDiffs.reduce(function(a, b) { return a + b; }, 0) / bestDiffs.length;
    golferRank.push({ name: g.name, id: gKeys[gi], handicapIdx: handicapIdx, rounds: g.diffs.length, bestN: bestN });
  }
  golferRank.sort(function(a, b) { return a.handicapIdx - b.handicapIdx; });

  var medals = ['&#129351;', '&#129352;', '&#129353;'];
  for (var li = 0; li < golferRank.length; li++) {
    var g = golferRank[li];
    var medal = li < 3 ? medals[li] : (li + 1) + '.';
    var idxStr = g.handicapIdx >= 0 ? '+' + g.handicapIdx.toFixed(1) : g.handicapIdx.toFixed(1);
    html += '<div class="leaderboard-row"><div class="lb-rank">' + medal + '</div>';
    html += '<div class="lb-name" style="cursor:pointer" onclick="showPlayerDetail(' + g.id + ')">' + g.name + ' <span style="font-size:11px;color:var(--text-muted)">(' + g.rounds + ' rds, best ' + g.bestN + ')</span></div>';
    html += '<div class="lb-score">' + idxStr + '</div></div>';
  }

  // --- ALL-TIME TOP SINGLE ROUNDS ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#11088; Top Single Rounds</label>';
  html += '<div style="font-size:10px;color:var(--text-muted);margin-bottom:10px">Best individual rounds. Gross = raw vs par. Net = adjusted for course difficulty.</div>';
  var allScores = [];
  for (var ri = 0; ri < state.rounds.length; ri++) {
    var round = state.rounds[ri];
    var diffFactor = 1.0;
    if (round.courseDifficulty) { diffFactor = round.courseDifficulty <= 2 ? 0.85 : round.courseDifficulty <= 3.5 ? 1.0 : 1.15; }
    for (var rr = 0; rr < round.results.length; rr++) {
      var res = round.results[rr];
      var grossDiff = res.total - round.coursePar;
      var netDiff = grossDiff * diffFactor;
      allScores.push({ name: res.playerName, playerId: res.playerId, total: res.total, coursePar: round.coursePar, courseName: round.courseName, courseId: round.courseId, grossDiff: grossDiff, netDiff: netDiff, date: round.date });
    }
  }
  allScores.sort(function(a, b) { return a.netDiff - b.netDiff; });
  var topN = Math.min(5, allScores.length);
  html += '<table class="history-table"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Gross</th><th>Net</th><th>Course</th></tr></thead><tbody>';
  for (var ti = 0; ti < topN; ti++) {
    var s = allScores[ti];
    var grossStr = s.grossDiff > 0 ? '+' + s.grossDiff : s.grossDiff === 0 ? 'E' : '' + s.grossDiff;
    var grossColor = s.grossDiff < 0 ? 'var(--primary)' : s.grossDiff > 0 ? 'var(--error)' : 'var(--text)';
    var netRounded = Math.round(s.netDiff * 10) / 10;
    var netStr = netRounded > 0 ? '+' + netRounded.toFixed(1) : netRounded === 0 ? 'E' : netRounded.toFixed(1);
    var netColor = netRounded < 0 ? 'var(--primary)' : netRounded > 0 ? 'var(--error)' : 'var(--text)';
    html += '<tr><td>' + (ti + 1) + '</td><td style="font-weight:600;cursor:pointer" onclick="showPlayerDetail(' + s.playerId + ')">' + s.name + '</td>';
    html += '<td style="font-family:var(--font-mono);font-weight:700">' + s.total + '</td>';
    html += '<td style="color:' + grossColor + ';font-family:var(--font-mono)">' + grossStr + '</td>';
    html += '<td style="color:' + netColor + ';font-family:var(--font-mono);font-weight:700">' + netStr + '</td>';
    var sCourseId = s.courseId || -1;
    var courseClickable = sCourseId >= 0 ? ' style="font-size:11px;cursor:pointer;color:var(--text-secondary);text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="showCourseDetail(' + sCourseId + ')"' : ' style="font-size:11px;color:var(--text-muted)"';
    html += '<td' + courseClickable + '>' + s.courseName + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- RECENT ROUNDS ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#128203; Recent Rounds</label>';
  html += '<div class="mb-12"><input class="input" placeholder="&#128269; Search rounds by player or course..." oninput="filterHistory(this.value)" style="font-size:13px"></div>';

  for (var ri = state.rounds.length - 1; ri >= Math.max(0, state.rounds.length - 10); ri--) {
    var round = state.rounds[ri];
    var d = new Date(round.date);
    var dateStr = (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
    var playerNames = round.results.map(function(r) { return r.playerName; }).join(', ');
    var winner = round.results[0];
    for (var wr = 1; wr < round.results.length; wr++) { if (round.results[wr].total < winner.total) winner = round.results[wr]; }
    var winDiff = winner.total - round.coursePar;
    var winDiffStr = winDiff > 0 ? '+' + winDiff : winDiff === 0 ? 'E' : '' + winDiff;

    html += '<div class="player-row" style="flex-wrap:wrap">';
    html += '<div style="flex:1;min-width:150px">';
    html += '<div style="font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="showCourseDetail(' + round.courseId + ')">' + round.courseName + '</div>';
    html += '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">' + dateStr + ' &middot; ' + playerNames + '</div>';
    html += '</div>';
    html += '<div style="text-align:right">';
    html += '<div style="font-weight:700;color:var(--primary);font-size:13px;cursor:pointer" onclick="showPlayerDetail(' + winner.playerId + ')">' + winner.playerName + ' &#127942;</div>';
    html += '<div style="font-size:12px;font-family:var(--font-mono);color:var(--text-secondary);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="showRoundScorecard(' + ri + ')">' + winner.total + ' (' + winDiffStr + ')</div>';
    html += '</div>';
    html += '<div style="width:100%;display:flex;justify-content:space-between;margin-top:6px;font-size:10px">';
    html += '<span style="color:var(--text-muted);cursor:pointer" onclick="showRoundScorecard(' + ri + ')">&#128203; View Scorecard</span>';
    html += '<span style="color:var(--primary);cursor:pointer" onclick="playRoundCourse(' + ri + ')">&#9971; Play Again &rarr;</span>';
    html += '</div>';
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('page-history').innerHTML = html;
}

function playRoundCourse(roundIdx) {
  var round = state.rounds[roundIdx];
  var course = null;
  for (var ci = 0; ci < state.courses.length; ci++) {
    if (state.courses[ci].id === round.courseId) { course = state.courses[ci]; break; }
  }
  if (course) {
    state.selectedCourse = course;
    showPage('play');
  }
}


// ===================== ACHIEVEMENTS =====================
function renderAchievementsPage() {
  var html = '<div class="card"><div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg> Records</div>';
  html += '<div class="card-subtitle">All-time top 5 in each category across all golfers.</div>';

  if (state.rounds.length === 0) {
    html += '<div class="empty-state"><div class="emoji">&#127942;</div><p>Play some rounds to start setting records!</p></div></div>';
    document.getElementById('page-achievements').innerHTML = html;
    return;
  }

  // Gather all data
  var playerRoundData = [];
  var playerAgg = {};
  for (var ri = 0; ri < state.rounds.length; ri++) {
    var round = state.rounds[ri];
    var diffFactor = round.courseDifficulty ? (round.courseDifficulty <= 2 ? 0.85 : round.courseDifficulty <= 3.5 ? 1.0 : 1.15) : 1.0;
    // Determine round winner
    var winnerTotal = 999;
    for (var rr = 0; rr < round.results.length; rr++) { if (round.results[rr].total < winnerTotal) winnerTotal = round.results[rr].total; }

    for (var rr = 0; rr < round.results.length; rr++) {
      var res = round.results[rr];
      var grossDiff = res.total - round.coursePar;
      var netDiff = grossDiff * diffFactor;
      var isWinner = res.total === winnerTotal;

      // Calculate birdie streak for this round
      var course = null;
      for (var ci = 0; ci < state.courses.length; ci++) { if (state.courses[ci].id === round.courseId) { course = state.courses[ci]; break; } }
      var streak = 0, maxStreak = 0;
      if (course) {
        var holes = course.holeIds.map(function(id) { return ALL_HOLES[id]; });
        for (var si = 0; si < res.scores.length; si++) {
          if (res.scores[si] !== null && holes[si] && res.scores[si] <= holes[si].par) { streak++; if (streak > maxStreak) maxStreak = streak; }
          else { streak = 0; }
        }
      }

      playerRoundData.push({
        playerId: res.playerId,
        name: res.playerName,
        total: res.total,
        grossDiff: grossDiff,
        netDiff: netDiff,
        courseName: round.courseName,
        courseId: round.courseId,
        date: round.date,
        streak: maxStreak,
        isWinner: isWinner,
        roundIdx: ri
      });

      if (!playerAgg[res.playerId]) playerAgg[res.playerId] = { name: res.playerName, id: res.playerId, rounds: 0, wins: 0, hios: 0 };
      playerAgg[res.playerId].rounds++;
      if (isWinner) playerAgg[res.playerId].wins++;
      for (var si = 0; si < res.scores.length; si++) { if (res.scores[si] === 1 && holes[si] && holes[si].par >= 2) playerAgg[res.playerId].hios++; }
    }
  }

  // --- LOWEST GROSS SCORE ---
  html += '<label class="label" style="margin-bottom:6px">&#127942; Lowest Gross Score (vs Par)</label>';
  var byGross = playerRoundData.slice().sort(function(a, b) { return a.grossDiff - b.grossDiff; });
  html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>Score</th><th>vs Par</th><th>Course</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(5, byGross.length); i++) {
    var r = byGross[i];
    var gStr = r.grossDiff > 0 ? '+' + r.grossDiff : r.grossDiff === 0 ? 'E' : '' + r.grossDiff;
    var gColor = r.grossDiff < 0 ? 'var(--primary)' : r.grossDiff > 0 ? 'var(--error)' : 'var(--text)';
    html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.playerId + ')">' + r.name + '</td>';
    html += '<td style="font-family:var(--font-mono);cursor:pointer" onclick="showRoundScorecard(' + r.roundIdx + ')">' + r.total + '</td>';
    html += '<td style="color:' + gColor + ';font-family:var(--font-mono);font-weight:700">' + gStr + '</td>';
    html += '<td style="font-size:11px;cursor:pointer;color:var(--text-secondary);text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3)" onclick="showCourseDetail(' + r.courseId + ')">' + r.courseName + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- LOWEST NET SCORE ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#11088; Lowest Net Score (adjusted for difficulty)</label>';
  var byNet = playerRoundData.slice().sort(function(a, b) { return a.netDiff - b.netDiff; });
  html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>Net</th><th>Course</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(5, byNet.length); i++) {
    var r = byNet[i];
    var nRounded = Math.round(r.netDiff * 10) / 10;
    var nStr = nRounded > 0 ? '+' + nRounded.toFixed(1) : nRounded === 0 ? 'E' : nRounded.toFixed(1);
    var nColor = nRounded < 0 ? 'var(--primary)' : nRounded > 0 ? 'var(--error)' : 'var(--text)';
    html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.playerId + ')">' + r.name + '</td>';
    html += '<td style="color:' + nColor + ';font-family:var(--font-mono);font-weight:700;cursor:pointer" onclick="showRoundScorecard(' + r.roundIdx + ')">' + nStr + '</td>';
    html += '<td style="font-size:11px;cursor:pointer;color:var(--text-secondary);text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3)" onclick="showCourseDetail(' + r.courseId + ')">' + r.courseName + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- BEST BIRDIE STREAK ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#128293; Longest Birdie Streak (consecutive holes at/under par)</label>';
  var byStreak = playerRoundData.filter(function(r) { return r.streak > 0; }).sort(function(a, b) { return b.streak - a.streak; });
  html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>Streak</th><th>Course</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(5, byStreak.length); i++) {
    var r = byStreak[i];
    html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.playerId + ')">' + r.name + '</td>';
    html += '<td style="font-family:var(--font-mono);font-weight:700;color:var(--primary)">' + r.streak + ' holes</td>';
    html += '<td style="font-size:11px;cursor:pointer;color:var(--text-secondary);text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3)" onclick="showCourseDetail(' + r.courseId + ')">' + r.courseName + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- MOST ROUNDS PLAYED ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#127947; Most Rounds Played</label>';
  var aggArr = Object.keys(playerAgg).map(function(k) { return playerAgg[k]; });
  var byRounds = aggArr.slice().sort(function(a, b) { return b.rounds - a.rounds; });
  html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>Rounds</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(5, byRounds.length); i++) {
    var r = byRounds[i];
    html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.id + ')">' + r.name + '</td>';
    html += '<td style="font-family:var(--font-mono);font-weight:700">' + r.rounds + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- BEST WIN % ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#128170; Best Win Rate (min 3 rounds)</label>';
  var byWinPct = aggArr.filter(function(a) { return a.rounds >= 3; }).map(function(a) { a.winPct = Math.round((a.wins / a.rounds) * 100); return a; }).sort(function(a, b) { return b.winPct - a.winPct; });
  html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>Win %</th><th>W / R</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(5, byWinPct.length); i++) {
    var r = byWinPct[i];
    html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.id + ')">' + r.name + '</td>';
    html += '<td style="font-family:var(--font-mono);font-weight:700;color:var(--primary)">' + r.winPct + '%</td>';
    html += '<td style="font-size:11px;color:var(--text-muted)">' + r.wins + ' / ' + r.rounds + '</td></tr>';
  }
  html += '</tbody></table>';

  // --- MOST HOLE IN ONES ---
  html += '<label class="label" style="margin-top:20px;margin-bottom:6px">&#127775; Most Hole in Ones</label>';
  var byHio = aggArr.filter(function(a) { return a.hios > 0; }).sort(function(a, b) { return b.hios - a.hios; });
  if (byHio.length === 0) {
    html += '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">No hole in ones yet!</div>';
  } else {
    html += '<table class="history-table" style="font-size:12px"><thead><tr><th>#</th><th>Golfer</th><th>HIOs</th></tr></thead><tbody>';
    for (var i = 0; i < Math.min(5, byHio.length); i++) {
      var r = byHio[i];
      html += '<tr><td>' + (i+1) + '</td><td style="cursor:pointer" onclick="showPlayerDetail(' + r.id + ')">' + r.name + '</td>';
      html += '<td style="font-family:var(--font-mono);font-weight:700;color:var(--accent)">' + r.hios + '</td></tr>';
    }
    html += '</tbody></table>';
  }

  html += '</div>';
  document.getElementById('page-achievements').innerHTML = html;
}

// ===================== DETAIL VIEWS =====================
function showOverlay(html) {
  closeOverlay();
  var overlay = document.createElement('div');
  overlay.id = 'detail-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto';
  overlay.innerHTML = '<div style="background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">' + html + '</div>';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });
  document.body.appendChild(overlay);
}

function closeOverlay() {
  var el = document.getElementById('detail-overlay');
  if (el) el.remove();
}

function showPlayerDetail(playerId) {
  var player = null;
  for (var i = 0; i < state.players.length; i++) { if (state.players[i].id == playerId) { player = state.players[i]; break; } }
  if (!player) return;

  // Gather stats
  var rounds = [];
  var courseCounts = {};
  var wins = 0;
  for (var ri = 0; ri < state.rounds.length; ri++) {
    var round = state.rounds[ri];
    var result = null;
    for (var rr = 0; rr < round.results.length; rr++) { if (round.results[rr].playerId === playerId) { result = round.results[rr]; break; } }
    if (!result) continue;
    var diffFactor = round.courseDifficulty ? (round.courseDifficulty <= 2 ? 0.85 : round.courseDifficulty <= 3.5 ? 1.0 : 1.15) : 1.0;
    var grossDiff = result.total - round.coursePar;
    rounds.push({ total: result.total, coursePar: round.coursePar, grossDiff: grossDiff, netDiff: grossDiff * diffFactor, courseName: round.courseName, courseId: round.courseId, date: round.date });
    if (!courseCounts[round.courseName]) courseCounts[round.courseName] = 0;
    courseCounts[round.courseName]++;
    // Check if winner
    var isWinner = true;
    for (var wr = 0; wr < round.results.length; wr++) { if (round.results[wr].playerId !== playerId && round.results[wr].total < result.total) { isWinner = false; break; } }
    if (isWinner) wins++;
  }

  // GHIN handicap
  var diffs = rounds.map(function(r) { return r.netDiff; }).slice(-20);
  var sorted = diffs.slice().sort(function(a, b) { return a - b; });
  var bestN = Math.min(8, sorted.length);
  var handicapIdx = bestN > 0 ? sorted.slice(0, bestN).reduce(function(a, b) { return a + b; }, 0) / bestN : null;

  // Favorite course
  var favCourse = '';
  var maxPlays = 0;
  var cKeys = Object.keys(courseCounts);
  for (var ck = 0; ck < cKeys.length; ck++) { if (courseCounts[cKeys[ck]] > maxPlays) { maxPlays = courseCounts[cKeys[ck]]; favCourse = cKeys[ck]; } }


  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<div style="display:flex;align-items:center;gap:12px"><div class="player-avatar" style="width:44px;height:44px;font-size:20px">' + player.name[0].toUpperCase() + '</div>';
  html += '<div><div style="font-size:20px;font-weight:700">' + player.name + (player.lastName ? ' ' + player.lastName : '') + '</div>';
  html += '<div style="font-size:12px;color:var(--text-muted)">' + rounds.length + ' rounds played</div></div></div>';
  html += '<button onclick="closeOverlay()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">&times;</button></div>';

  // Stats grid
  html += '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin:12px 0">';
  html += '<div class="stat-card"><div class="stat-value">' + (handicapIdx !== null ? handicapIdx.toFixed(1) : '--') + '</div><div class="stat-label">Handicap</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + wins + '</div><div class="stat-label">Wins</div></div>';
  var winRate = rounds.length > 0 ? Math.round((wins / rounds.length) * 100) : 0;
  html += '<div class="stat-card"><div class="stat-value">' + winRate + '%</div><div class="stat-label">Win Rate</div></div>';
  html += '</div>';

  // Best / Worst (clickable to see scorecard)
  if (rounds.length > 0) {
    var bestRound = rounds.reduce(function(a, b) { return a.grossDiff < b.grossDiff ? a : b; });
    var worstRound = rounds.reduce(function(a, b) { return a.grossDiff > b.grossDiff ? a : b; });
    var bestIdx = findRoundIndex(playerId, bestRound.grossDiff, bestRound.courseName);
    var worstIdx = findRoundIndex(playerId, worstRound.grossDiff, worstRound.courseName);
    html += '<div style="display:flex;gap:8px;margin-bottom:12px">';
    html += '<div style="flex:1;padding:10px;background:rgba(74,222,128,0.08);border-radius:8px;border:1px solid rgba(74,222,128,0.15);text-align:center">';
    html += '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Best Round</div>';
    html += '<div style="font-weight:700;color:var(--primary);font-family:var(--font-mono)">' + (bestRound.grossDiff > 0 ? '+' : '') + bestRound.grossDiff + '</div>';
    html += '<div style="font-size:10px;color:var(--text-secondary);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="setTimeout(function(){showCourseDetail(' + bestRound.courseId + ')},0)">' + bestRound.courseName + '</div>';
    html += '<div style="font-size:9px;color:var(--primary);margin-top:4px;cursor:pointer" onclick="event.stopPropagation();showRoundScorecard(' + bestIdx + ')">View Scorecard &rarr;</div></div>';
    html += '<div style="flex:1;padding:10px;background:rgba(248,113,113,0.08);border-radius:8px;border:1px solid rgba(248,113,113,0.15);text-align:center">';
    html += '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Worst Round</div>';
    html += '<div style="font-weight:700;color:var(--error);font-family:var(--font-mono)">' + (worstRound.grossDiff > 0 ? '+' : '') + worstRound.grossDiff + '</div>';
    html += '<div style="font-size:10px;color:var(--text-secondary);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(248,113,113,0.3);text-underline-offset:2px" onclick="setTimeout(function(){showCourseDetail(' + worstRound.courseId + ')},0)">' + worstRound.courseName + '</div>';
    html += '<div style="font-size:9px;color:var(--error);margin-top:4px;cursor:pointer" onclick="event.stopPropagation();showRoundScorecard(' + worstIdx + ')">View Scorecard &rarr;</div></div>';
    html += '</div>';
  }

  // Favorite course
  if (favCourse) {
    var favCourseId = -1;
  for (var fci = 0; fci < state.courses.length; fci++) { if (state.courses[fci].name === favCourse) { favCourseId = state.courses[fci].id; break; } }
  if (favCourseId >= 0) {
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">&#127969; Favorite course: <strong style="cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="setTimeout(function(){showCourseDetail(' + favCourseId + ')},0)">' + favCourse + '</strong> (' + maxPlays + ' rounds)</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">&#127969; Favorite course: <strong>' + favCourse + '</strong> (' + maxPlays + ' rounds)</div>';
  }
  }



  // Per-course breakdown
  if (cKeys.length > 0) {
    html += '<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;font-weight:600">By Course</div>';
    html += '<table class="history-table" style="font-size:12px"><thead><tr><th>Course</th><th>Rounds</th><th>Avg</th><th>Best</th></tr></thead><tbody>';
    for (var ck = 0; ck < cKeys.length; ck++) {
      var cName = cKeys[ck];
      var cRounds = rounds.filter(function(r) { return r.courseName === cName; });
      var cAvg = cRounds.reduce(function(a, r) { return a + r.grossDiff; }, 0) / cRounds.length;
      var cBest = Math.min.apply(null, cRounds.map(function(r) { return r.grossDiff; }));
      var avgStr = cAvg >= 0 ? '+' + cAvg.toFixed(1) : cAvg.toFixed(1);
      var bestStr = cBest >= 0 ? '+' + cBest : '' + cBest;
      var cId = -1;
      for (var sci = 0; sci < state.courses.length; sci++) { if (state.courses[sci].name === cName) { cId = state.courses[sci].id; break; } }
      var courseNameClick = cId >= 0 ? '<span style="cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="setTimeout(function(){showCourseDetail(' + cId + ')},0)">' + cName + '</span>' : cName;
      html += '<tr><td>' + courseNameClick + '</td><td>' + cRounds.length + '</td><td style="font-family:var(--font-mono)">' + avgStr + '</td><td style="font-family:var(--font-mono);color:var(--primary)">' + bestStr + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }


  // Badges
  var stats = getPlayerStats(playerId);
  html += '<div style="margin-top:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;font-weight:600">Badges</div>';
  var anyUnlocked = false;
  for (var ai = 0; ai < ACHIEVEMENTS.length; ai++) {
    var ach = ACHIEVEMENTS[ai];
    var unlocked = ach.check(stats);
    if (unlocked) anyUnlocked = true;
    html += '<div class="achievement' + (unlocked ? '' : ' locked') + '"><div class="ach-icon">' + ach.icon + '</div><div><div class="ach-title">' + ach.title + '</div><div class="ach-desc">' + ach.desc + '</div></div></div>';
  }
  if (!anyUnlocked) html += '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">No badges unlocked yet. Keep playing!</div>';
  html += '</div>';

  showOverlay(html);
}

function showCourseDetail(courseId) {
  var course = null;
  for (var i = 0; i < state.courses.length; i++) { if (state.courses[i].id == courseId) { course = state.courses[i]; break; } }
  if (!course) return;

  var holes = course.holeIds.map(function(id) { return ALL_HOLES[id]; });
  var diffLabel = course.avgDifficulty <= 2 ? 'Easy' : course.avgDifficulty <= 3.5 ? 'Medium' : 'Hard';
  var bclass = course.avgDifficulty <= 2 ? 'badge-easy' : course.avgDifficulty <= 3.5 ? 'badge-med' : 'badge-hard';

  // Gather round stats for this course
  var courseRounds = state.rounds.filter(function(r) { return r.courseId === courseId; });
  var playerStats = {};
  var recordHolder = null;
  var recordHolderId = null;
  var recordScore = 999;
  for (var ri = 0; ri < courseRounds.length; ri++) {
    for (var rr = 0; rr < courseRounds[ri].results.length; rr++) {
      var res = courseRounds[ri].results[rr];
      if (!playerStats[res.playerId]) playerStats[res.playerId] = { name: res.playerName, scores: [] };
      playerStats[res.playerId].scores.push(res.total);
      if (res.total < recordScore) { recordScore = res.total; recordHolder = res.playerName; recordHolderId = res.playerId; }
    }
  }

  var html = '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">';
  html += '<div><div style="font-size:20px;font-weight:700">' + course.name + '</div>';
  html += '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">' + course.holeIds.length + ' holes &middot; Par ' + course.totalPar + ' &middot; <span class="badge ' + bclass + '">' + diffLabel + '</span></div></div>';
  html += '<button onclick="closeOverlay()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">&times;</button></div>';

  // Hole layout
  html += '<div style="margin-bottom:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;font-weight:600">Hole Layout</div>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">';
  for (var hi = 0; hi < holes.length; hi++) {
    var h = holes[hi];
    html += '<div style="text-align:center;padding:6px 4px;background:rgba(20,45,25,0.4);border-radius:6px;border:1px solid rgba(74,222,128,0.08);min-width:40px">';
    html += '<span class="tee-dot tee-' + h.color + '" style="width:10px;height:10px"></span>';
    html += '<div style="font-weight:700;font-size:12px;margin-top:2px;color:' + getTeeCSSColor(h.color) + '">' + h.name + '</div>';
    html += '<div style="font-size:10px;color:var(--text-muted)">P' + h.par + '</div></div>';
  }
  html += '</div></div>';

  // Play button
  html += '<button class="btn btn-primary" style="width:100%;margin-bottom:16px;justify-content:center" onclick="quickPlay(' + course.id + ')">&#9654;&#65039; Play This Course Now</button>';

  // Stats
  html += '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin:12px 0">';
  html += '<div class="stat-card"><div class="stat-value">' + courseRounds.length + '</div><div class="stat-label">Times Played</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + course.totalPar + '</div><div class="stat-label">Par</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + course.avgDifficulty.toFixed(1) + '</div><div class="stat-label">Difficulty</div></div>';
  html += '</div>';

  // Course record
  if (recordHolder) {
    var recDiff = recordScore - course.totalPar;
    var recStr = recDiff > 0 ? '+' + recDiff : recDiff === 0 ? 'E' : '' + recDiff;
    html += '<div style="padding:12px;background:rgba(251,191,36,0.08);border-radius:8px;border:1px solid rgba(251,191,36,0.2);margin-bottom:12px;text-align:center">';
    html += '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Course Record</div>';
    html += '<div style="font-size:16px;font-weight:700;color:var(--accent);cursor:pointer" onclick="showPlayerDetail(' + recordHolderId + ')">' + recordHolder + ' &mdash; ' + recordScore + ' (' + recStr + ')</div></div>';
  }

  // Player averages on this course
  var pKeys = Object.keys(playerStats);
  if (pKeys.length > 0) {
    html += '<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;font-weight:600">Player Averages</div>';
    html += '<table class="history-table" style="font-size:12px"><thead><tr><th>Player</th><th>Rounds</th><th>Avg</th><th>Best</th></tr></thead><tbody>';
    var pArr = [];
    for (var pk = 0; pk < pKeys.length; pk++) {
      var ps = playerStats[pKeys[pk]];
      var avg = ps.scores.reduce(function(a, b) { return a + b; }, 0) / ps.scores.length;
      var best = Math.min.apply(null, ps.scores);
      pArr.push({ name: ps.name, id: pKeys[pk], rounds: ps.scores.length, avg: avg, best: best });
    }
    pArr.sort(function(a, b) { return a.avg - b.avg; });
    for (var pa = 0; pa < pArr.length; pa++) {
      var p = pArr[pa];
      var avgDiff = p.avg - course.totalPar;
      var avgStr = avgDiff >= 0 ? '+' + avgDiff.toFixed(1) : avgDiff.toFixed(1);
      var bestDiff = p.best - course.totalPar;
      var bestStr = bestDiff >= 0 ? '+' + bestDiff : '' + bestDiff;
      html += '<tr><td style="cursor:pointer" onclick="showPlayerDetail(' + p.id + ')">' + p.name + '</td><td>' + p.rounds + '</td><td style="font-family:var(--font-mono)">' + avgStr + '</td><td style="font-family:var(--font-mono);color:var(--primary)">' + bestStr + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }

  showOverlay(html);
}

function showHoleDetail(holeId) {
  var hole = ALL_HOLES[holeId];
  if (!hole) return;

  // Gather stats for this hole across all rounds
  var holeScores = {};
  for (var ri = 0; ri < state.rounds.length; ri++) {
    var round = state.rounds[ri];
    var course = null;
    for (var ci = 0; ci < state.courses.length; ci++) { if (state.courses[ci].id === round.courseId) { course = state.courses[ci]; break; } }
    if (!course) continue;
    var hIdx = -1;
    for (var hi = 0; hi < course.holeIds.length; hi++) { if (course.holeIds[hi] === holeId) { hIdx = hi; break; } }
    if (hIdx === -1) continue;
    for (var rr = 0; rr < round.results.length; rr++) {
      var res = round.results[rr];
      var score = res.scores[hIdx];
      if (score === null || score === undefined) continue;
      if (!holeScores[res.playerId]) holeScores[res.playerId] = { name: res.playerName, scores: [] };
      holeScores[res.playerId].scores.push(score);
    }
  }

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<div style="display:flex;align-items:center;gap:12px"><span class="tee-dot tee-' + hole.color + '" style="width:28px;height:28px"></span>';
  html += '<div><div style="font-size:20px;font-weight:700">' + hole.fullName + '</div>';
  html += '<div style="font-size:12px;color:var(--text-muted)">Par ' + hole.par + ' &middot; Difficulty: ' + '&#11088;'.repeat(hole.difficulty) + '</div></div></div>';
  html += '<button onclick="closeOverlay()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">&times;</button></div>';

  // Description placeholder
  var desc = hole.description || null;
  if (desc) {
    html += '<div style="padding:12px;background:rgba(20,45,25,0.4);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--text-secondary);font-style:italic">' + desc + '</div>';
  } else {
    html += '<div style="padding:12px;background:rgba(20,45,25,0.3);border-radius:8px;margin-bottom:12px;font-size:12px;color:var(--text-muted);text-align:center">No description yet. Add one in Developer Mode.</div>';
  }

  // Stats
  var totalPlays = 0;
  var allScoresArr = [];
  var hioCount = 0;
  var pKeys = Object.keys(holeScores);
  for (var pk = 0; pk < pKeys.length; pk++) {
    var ps = holeScores[pKeys[pk]];
    totalPlays += ps.scores.length;
    for (var si = 0; si < ps.scores.length; si++) {
      allScoresArr.push(ps.scores[si]);
      if (ps.scores[si] === 1 && hole.par >= 2) hioCount++;
    }
  }
  var overallAvg = allScoresArr.length > 0 ? (allScoresArr.reduce(function(a, b) { return a + b; }, 0) / allScoresArr.length) : 0;

  html += '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin:12px 0">';
  html += '<div class="stat-card"><div class="stat-value">' + totalPlays + '</div><div class="stat-label">Times Played</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + (overallAvg > 0 ? overallAvg.toFixed(1) : '--') + '</div><div class="stat-label">Avg Score</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + hioCount + '</div><div class="stat-label">Hole in Ones</div></div>';
  html += '</div>';

  // Player breakdown
  if (pKeys.length > 0) {
    html += '<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;font-weight:600">Player Scores</div>';
    html += '<table class="history-table" style="font-size:12px"><thead><tr><th>Player</th><th>Played</th><th>Avg</th><th>Best</th></tr></thead><tbody>';
    var pArr = [];
    for (var pk = 0; pk < pKeys.length; pk++) {
      var ps = holeScores[pKeys[pk]];
      var avg = ps.scores.reduce(function(a, b) { return a + b; }, 0) / ps.scores.length;
      var best = Math.min.apply(null, ps.scores);
      pArr.push({ name: ps.name, id: pKeys[pk], count: ps.scores.length, avg: avg, best: best });
    }
    pArr.sort(function(a, b) { return a.avg - b.avg; });
    for (var pa = 0; pa < pArr.length; pa++) {
      var p = pArr[pa];
      var avgColor = p.avg <= hole.par ? 'var(--primary)' : p.avg > hole.par + 0.5 ? 'var(--error)' : 'var(--text)';
      html += '<tr><td style="cursor:pointer" onclick="showPlayerDetail(' + p.id + ')">' + p.name + '</td><td>' + p.count + '</td><td style="font-family:var(--font-mono);color:' + avgColor + '">' + p.avg.toFixed(1) + '</td><td style="font-family:var(--font-mono);color:var(--primary)">' + p.best + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }

  showOverlay(html);
}


function showRoundScorecard(roundIdx) {
  var round = state.rounds[roundIdx];
  if (!round) return;
  var course = null;
  for (var ci = 0; ci < state.courses.length; ci++) { if (state.courses[ci].id === round.courseId) { course = state.courses[ci]; break; } }
  
  var d = new Date(round.date);
  var dateStr = (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  
  var html = '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">';
  html += '<div><div style="font-size:18px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="showCourseDetail(' + round.courseId + ')">' + round.courseName + '</div>';
  html += '<div style="font-size:12px;color:var(--text-muted)">' + dateStr + ' &middot; Par ' + round.coursePar + '</div></div>';
  html += '<button onclick="closeOverlay()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">&times;</button></div>';

  // Build scorecard table
  var holes = [];
  if (course) { holes = course.holeIds.map(function(id) { return ALL_HOLES[id]; }); }
  
  html += '<div style="overflow-x:auto"><table class="history-table" style="font-size:11px;text-align:center"><thead><tr><th style="text-align:left">Player</th>';
  if (holes.length > 0) {
    for (var h = 0; h < holes.length; h++) {
      html += '<th style="padding:4px 3px"><span class="tee-dot tee-' + holes[h].color + '" style="width:6px;height:6px;border-width:1px"></span><br>' + holes[h].name + '</th>';
    }
  } else {
    // No course detail available, just show numbered holes
    var numHoles = round.results[0] ? round.results[0].scores.length : 0;
    for (var h = 0; h < numHoles; h++) html += '<th style="padding:4px 3px">' + (h+1) + '</th>';
  }
  html += '<th>TOT</th><th>+/-</th></tr></thead><tbody>';

  // Par row
  if (holes.length > 0) {
    html += '<tr style="color:var(--text-muted)"><td style="text-align:left;font-size:10px">PAR</td>';
    for (var h = 0; h < holes.length; h++) html += '<td style="padding:4px 3px;font-size:10px">' + holes[h].par + '</td>';
    html += '<td style="font-weight:600">' + round.coursePar + '</td><td></td></tr>';
  }

  // Player rows
  for (var pi = 0; pi < round.results.length; pi++) {
    var res = round.results[pi];
    var diff = res.total - round.coursePar;
    var diffStr = diff > 0 ? '+' + diff : diff === 0 ? 'E' : '' + diff;
    var diffColor = diff < 0 ? 'var(--primary)' : diff > 0 ? 'var(--error)' : 'var(--text)';
    html += '<tr><td style="text-align:left;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(74,222,128,0.3);text-underline-offset:2px" onclick="showPlayerDetail(' + res.playerId + ')">' + res.playerName + '</td>';
    for (var si = 0; si < res.scores.length; si++) {
      var s = res.scores[si];
      var cellColor = 'var(--text)';
      if (s !== null && holes.length > 0) {
        var d2 = s - holes[si].par;
        if (s === 1) cellColor = 'var(--accent)';
        else if (d2 < 0) cellColor = 'var(--primary)';
        else if (d2 > 0) cellColor = 'var(--error)';
      }
      html += '<td style="padding:4px 3px;font-family:var(--font-mono);color:' + cellColor + '">' + (s !== null ? s : '-') + '</td>';
    }
    html += '<td style="font-weight:700;font-family:var(--font-mono)">' + res.total + '</td>';
    html += '<td style="color:' + diffColor + ';font-weight:600;font-family:var(--font-mono)">' + diffStr + '</td></tr>';
  }
  html += '</tbody></table></div>';

  showOverlay(html);
}

function findRoundIndex(playerId, grossDiff, courseName) {
  // Find the round that matches these criteria for linking from player detail
  for (var ri = state.rounds.length - 1; ri >= 0; ri--) {
    var round = state.rounds[ri];
    if (round.courseName !== courseName) continue;
    for (var rr = 0; rr < round.results.length; rr++) {
      if (round.results[rr].playerId === playerId && (round.results[rr].total - round.coursePar) === grossDiff) {
        return ri;
      }
    }
  }
  return -1;
}


function filterPlayers(query) {
  // When searching, show all players that match (not limited to 8)
  var rows = document.querySelectorAll('#page-players .player-row');
  if (!query) {
    // No search - just show/hide based on the current rendered set
    for (var i = 0; i < rows.length; i++) rows[i].style.display = '';
    return;
  }
  query = query.toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    var name = rows[i].textContent.toLowerCase();
    rows[i].style.display = name.indexOf(query) >= 0 ? '' : 'none';
  }
  // If searching and players are hidden by the 8-limit, re-render to show all
  if (query.length > 0 && !state._showAllGolfers) {
    state._showAllGolfers = true;
    renderPlayersPage();
    // Re-set the search value and re-filter after render
    setTimeout(function() {
      var el = document.getElementById('player-search');
      if (el) { el.value = query; el.focus(); filterPlayers(query); }
    }, 10);
  }
}

function filterCourses(query) {
  var rows = document.querySelectorAll('#page-course .player-row');
  query = query.toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    var name = rows[i].textContent.toLowerCase();
    rows[i].style.display = name.indexOf(query) >= 0 ? '' : 'none';
  }
}

function filterHistory(query) {
  var rows = document.querySelectorAll('#page-history .player-row');
  query = query.toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    var name = rows[i].textContent.toLowerCase();
    rows[i].style.display = name.indexOf(query) >= 0 ? '' : 'none';
  }
}


function quickPlay(courseId) {
  closeOverlay();
  for (var i = 0; i < state.courses.length; i++) {
    if (state.courses[i].id === courseId) { state.selectedCourse = state.courses[i]; break; }
  }
  showPage('play');
}

// ===================== INIT =====================
loadState();
if (!state.selectedCourse && state.courses.length > 0) state.selectedCourse = state.courses[0];
renderNav();
renderCoursePage();
</script>
